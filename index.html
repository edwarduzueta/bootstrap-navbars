<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Navbars – WOD 1</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <!-- WOD 1: Boardroom Kailua–inspired navbar -->
    <div class="container-fluid px-0 brd-bg">
      <nav class="navbar navbar-expand-lg bg-gradient" aria-label="Boardroom-inspired top bar">
        <div class="container py-2 d-flex align-items-center nav-3col w-100">

          <!-- left: instagram icon -->
          <ul class="nav justify-content-start flex-grow-1">
            <li class="nav-item">
              <a class="navbar-brand" href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Instagram">
                <i class="bi bi-instagram fs-4"></i>
              </a>
            </li>
          </ul>

          <!-- center: hotlinked Boardroom logo -->
          <ul class="nav justify-content-center">
            <li class="nav-item">
              <img src="https://courses.ics.hawaii.edu/ics314f25/morea/ui-frameworks/experience-bootstrap-navbars-board-room-logo.png"
                   class="brd-logo"
                   alt="The Boardroom Kailua logo">
            </li>
          </ul>

          <!-- right: Menu button -->
          <ul class="nav justify-content-end flex-grow-1">
            <li class="nav-item ms-auto">
              <button type="button" class="btn btn-dark">Menu</button>
            </li>
          </ul>

        </div>
      </nav>
    </div>

    <div class="container my-4">
      <h1 class="h3">Bootstrap 5 Hello World (WOD 1 Scaffold)</h1>
    </div>

    <!-- Bootstrap 5 JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
  </body>
</html>

    <!-- ===================== -->

    <!-- ===================== -->
    <!-- WOD 2: Morning Brew navbar (two-row) -->
    <!-- ===================== -->
    <div id="navbar2-morningbrew" class="mbrew-wrapper">

      <!-- Row 1: logo centered -->
      <nav class="navbar navbar-expand-lg bg-light">
        <div class="container py-2">
          <div class="mx-auto navbar-nav">
            <img
              src="https://static.wixstatic.com/media/099475_c2c8d91a0359407fa3966db2a7f0b84f~mv2.png/v1/fill/w_265%2Ch_55%2Cal_c%2Cq_85%2Cusm_0.66_1.00_0.01%2Cenc_avif%2Cquality_auto/Morning%20Brew%20Hawaii%20Logo%20Black.png"
              alt="Morning Brew Hawaii logo" class="mbrew-logo img-fluid">
          </div>
        </div>
      </nav>

      <!-- Row 2: sticky menu items centered -->
      <div class="navbar navbar-expand-lg bg-light sticky-top">
        <div class="container">
          <div class="mx-auto navbar-nav mbrew-menu d-flex">

            <div class="nav-item border-1 border-top border-dark active border-3">Home</div>
            <div class="nav-item border-1 border-top border-dark">Order Online</div>
            <div class="nav-item border-1 border-top border-dark">Menus</div>
            <div class="nav-item border-1 border-top border-dark">Locations</div>
            <div class="nav-item border-1 border-top border-dark">About</div>
            <div class="nav-item border-1 border-top border-dark">Shop</div>
            <div class="nav-item border-1 border-top border-dark">Contact</div>

          </div>
        </div>
      </div>

    </div>
    <!-- end WOD 2 -->
